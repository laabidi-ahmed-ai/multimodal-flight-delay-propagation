# Project configuration (safe to commit: no secrets here)

# Where ALL data is stored. Outside the repo and outside OneDrive.
data_dir: C:/data/flight-delay

# Departure hubs in scope (IATA codes)
hubs: [ATL, ORD, DFW, DEN, LAX, JFK, CLT, LAS, PHX, SEA]

# Study period. Scripts simply skip what is not published yet.
period:
  start: 2024-01-01   # training 2024-2025; test 2026
  end: 2026-10-27

# Airport codes that changed over time: {code seen in BTS: code known to airportsdata}.
# Both codes are the same airport (same BTS AirportID), so they map to ONE station.
airport_aliases:
  DJT: PBI   # Palm Beach International: BTS uses PBI until Jul 2026, DJT from Aug 2026 (AirportID 14027)

# IEM weather station ids to try FIRST for a station, keyed by its stations.csv (IATA) code.
# Needed when IEM's archive does not follow the code: after the PBI -> DJT rename, IEM moved
# the WHOLE Palm Beach METAR history to DJT (PBI/KPBI return nothing, even for 2025), but
# split the TAF archive: KPBI until ~2026-07-09, KDJT after. Each TAF id is saved as its own
# raw file (KPBI.csv, KDJT.csv); the two are merged in Silver (dedupe the overlap).
weather_station_ids:
  PBI: {metar: [DJT], taf: [KPBI, KDJT]}

# Extra days of weather before the period start
# (a flight on 1 Jan early morning needs the TAF issued on 31 Dec)
weather_buffer_days: 2

radar:
  product: n0q        # n0q = high resolution (~2-5 MB/image) | n0r = low resolution (~0.3 MB)
  crop_px: 256        # square crop size in native pixels (n0q: ~0.005 deg/pixel -> ~140 km wide)
  frames_before_t_pred: 3   # hourly frames needed at and before T_pred
  keep_national_days: [2025-07-15]   # national images kept on disk for debugging only
  # Expected .wld georeference of the national image: [A, D, B, E, C, F] = pixel width (deg),
  # 2 rotation terms, pixel height (deg, negative), upper-left lon, upper-left lat.
  # Checked on 2024-01-01, 2025-07-15 and 2026-10-27 (n0q). download_radar stops if a .wld
  # differs: crops would otherwise be cut at the wrong place without any error.
  expected_wld: [0.005, 0.0, 0.0, -0.005, -126.0, 50.0]

# Prediction moment: scheduled departure minus this many hours
t_pred_hours_before_departure: 2

# Politeness towards the IEM servers (seconds between requests)
iem_sleep_seconds: 1.0

# ---- Keys below are not used by the ingest scripts (used from Phase 1-2 on) ----

# Time-based split, never random (Golden rule 3). Model selection on validation only.
split:
  train: [2024-01-01, 2025-12-31]
  validation: [2026-01-01, 2026-02-28]
  test: [2026-03-01, 2026-10-27]   # touched ONCE, for the final numbers

# Broken-chain rule (CLAUDE.md section 5): max scheduled ground time (hours) between two
# consecutive legs of the same tail before a new chain starts.
# null on purpose: chosen in Phase 1 (step 1.2) from the ground-time distribution
# (gap between short turnarounds and overnight stops), then documented.
chain_break_ground_time_hours: null

# Cost-style metric (CLAUDE.md section 12). STATED ASSUMPTIONS, not real airline figures:
# cite a source or run a sensitivity analysis before reporting any cost.
cost_missed_delay: 1.0    # relative cost of a delay the model did not flag
cost_false_alarm: 0.2     # relative cost of an unnecessary action
